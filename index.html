<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>진모의 버킷리스트</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 650px;
        margin: 50px auto;
        background-color: #fffdf0;
        color: #333;
      }
      p {
        text-align: center;
        color: #3b5cee;
        font-size: 15px;
        font-weight: 700;
      }
      h1 {
        text-align: center;
        font-size: 2rem;
        color: #637df1;
      }
      h2 {
        border-left: 5px solid #637df1;
        padding-left: 10px;
        margin-top: 30px;
      }
      li {
        line-height: 2;
      }
    </style>
  </head>
  <body>
    <h1>나만의 버킷리스트</h1>
    <p>죽기 전에 꼭 해보고 싶은 것들</p>

    <h2>✈️ 여행</h2>
    <ul>
      <li>아이슬란드에서 오로라 보기</li>
      <li>나이아가라폭포 가보기</li>
      <li>겨울에 삿포로 가보기</li>
    </ul>

    <h2>💪 도전</h2>
    <ul>
      <li>마라톤 참가해보기</li>
      <li>외국인과 대화 될정도로 영어 공부하기</li>
      <li>복근 만들어보기</li>
    </ul>

    <h2>💻 개발자 목표</h2>
    <ul>
      <li>자주하는 게임 데이터 베이스 사이트 만들어보기</li>
      <li>나만의 캘린더 앱 만들어보기</li>
      <li>주변 사람들이 필요한 사이트 만들어주기</li>
    </ul>
  </body>
</html>
